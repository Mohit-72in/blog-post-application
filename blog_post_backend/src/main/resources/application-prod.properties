# Server port assigned dynamically by Render
server.port=${PORT:8080}

# Supabase PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.kzmbivsyfwptpbpxonnb}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP settings for Supabase pooler (avoids connection closed warnings)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.pool-name=HikariPool-SupabaseProd

# CORS: allow S3 frontend and CloudFront
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://blog-post-frontend-itsmohit-2026.s3-website.ap-south-1.amazonaws.com}

# Logging
logging.level.org.springframework=INFO
logging.level.com.tcs=INFO

