spring.application.name=blog_post_backend

# Server Configuration
server.port=${PORT:8080}

# Database Configuration: Defaults to H2 for local run; overrides with DB_URL/DB_USER/DB_PASSWORD in prod
spring.datasource.url=${DB_URL:jdbc:h2:mem:blogpostdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console for local testing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS: Allow AWS S3 frontend and localhost
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://blog-post-frontend-itsmohit-2026.s3-website.ap-south-1.amazonaws.com,http://localhost:4200}


