spring.application.name=blog_post_backend

# Server Configuration (Render assigns PORT dynamic environment variable)
server.port=${PORT:8080}

# Supabase PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.kzmbivsyfwptpbpxonnb}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase pooler connection stability settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000

# CORS: Allow AWS S3 frontend and localhost
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://blog-post-frontend-itsmohit-2026.s3-website.ap-south-1.amazonaws.com,http://localhost:4200}

