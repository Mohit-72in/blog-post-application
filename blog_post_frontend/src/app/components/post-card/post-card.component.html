<div class="card post-card mb-4 position-relative border rounded-3 p-4 shadow-sm">
  <!-- Delete button at top right border -->
  <button class="delete-btn" (click)="onDelete()" title="Delete Post" aria-label="Delete Post">
    <i class="bi bi-trash-fill fs-6"></i>
  </button>

  <div class="card-body p-0">
    <!-- Author Badge -->
    <div class="d-flex align-items-center gap-2 mb-2">
      <a [routerLink]="['/']" [queryParams]="{ author: post.author || 'anonymous' }" class="badge bg-secondary bg-opacity-10 text-dark border text-decoration-none px-2 py-1">
        <i class="bi bi-person-circle text-primary me-1"></i>&#64;{{ post.author || 'anonymous' }}
      </a>
    </div>

    <h3 class="card-title fw-semibold text-dark mb-3 fs-3">{{ post.title }}</h3>
    
    <p class="card-text text-secondary lead-sm lh-base mb-3 fs-6">
      {{ post.body }}
    </p>

    <!-- Tags -->
    <div class="d-flex flex-wrap gap-2 mb-3" *ngIf="post.tags && post.tags.length > 0">
      <span *ngFor="let tag of post.tags" class="badge bg-primary text-white rounded-pill px-3 py-2 fw-normal fs-6">
        {{ tag }}
      </span>
    </div>

    <!-- Reactions Alert -->
    <div class="alert alert-success-custom p-3 rounded-3 mb-3 text-dark fs-6 d-flex align-items-center justify-content-between">
      <span>This post has been reacted by {{ post.reactions }} people.</span>
    </div>

    <!-- Actions: React and Edit -->
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1 px-3 py-1" (click)="onReact()">
        <i class="bi bi-hand-thumbs-up-fill"></i> React
      </button>
      <a [routerLink]="['/edit', post.id]" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1 px-3 py-1">
        <i class="bi bi-pencil-square"></i> Edit
      </a>
    </div>
  </div>
</div>
